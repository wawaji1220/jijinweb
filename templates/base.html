<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}基金净值实时估算{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --primary-color: #1890ff;
            --success-color: #52c41a;
            --danger-color: #f5222d;
            --warning-color: #faad14;
        }

        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--primary-color) !important;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .fund-card {
            cursor: pointer;
        }

        .nav-value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .growth-up {
            color: var(--danger-color);
        }

        .growth-down {
            color: var(--success-color);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .search-box {
            max-width: 600px;
            margin: 0 auto;
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .auto-refresh-badge {
            font-size: 0.75rem;
        }

        @media (max-width: 768px) {
            .nav-value {
                font-size: 1.25rem;
            }
            .card {
                margin-bottom: 15px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'funds:index' %}">
                <i class="bi bi-graph-up-arrow"></i> 基金净值估算
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'funds:index' %}">
                            <i class="bi bi-house"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'funds:search' %}">
                            <i class="bi bi-search"></i> 搜索基金
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#settingsModal">
                            <i class="bi bi-gear"></i> 设置
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white mt-5 py-4 text-center">
        <div class="container">
            <p class="text-muted mb-0">
                <small>数据来源: 天天基金网 | 本站仅供参考,投资有风险</small>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <!-- 设置模态框 -->
    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-gear"></i> 系统设置
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="updateInterval" class="form-label">
                            <i class="bi bi-clock"></i> 数据刷新间隔（分钟）
                        </label>
                        <input type="number" class="form-control" id="updateInterval" min="1" max="1440" placeholder="30">
                        <div class="form-text">
                            建议范围: 10-120 分钟。修改后需重启容器生效。
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="displayCount" class="form-label">
                            <i class="bi bi-collection"></i> 首页显示基金数量
                        </label>
                        <input type="number" class="form-control" id="displayCount" min="1" max="200" placeholder="50">
                        <div class="form-text">
                            设置首页显示的基金数量上限，范围: 1-200。保存后需刷新页面生效。
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveSettings">
                        <i class="bi bi-check-lg"></i> 保存设置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    // 设置相关功能
    const settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));

    // 模态框显示时加载设置
    document.getElementById('settingsModal').addEventListener('show.bs.modal', function() {
        $.get('{% url "funds:api_settings_get" %}', function(response) {
            if (response.success) {
                $('#updateInterval').val(response.data.update_interval);
                $('#displayCount').val(response.data.display_count);
            }
        });
    });

    // 保存设置
    $('#saveSettings').click(function() {
        const interval = $('#updateInterval').val().trim();
        const displayCount = $('#displayCount').val().trim();

        if (interval && (isNaN(interval) || parseInt(interval) < 1 || parseInt(interval) > 1440)) {
            alert('刷新间隔必须在 1-1440 分钟之间');
            return;
        }
        if (displayCount && (isNaN(displayCount) || parseInt(displayCount) < 1 || parseInt(displayCount) > 200)) {
            alert('显示数量必须在 1-200 之间');
            return;
        }

        const postData = {};
        if (interval) postData.update_interval = interval;
        if (displayCount) postData.display_count = displayCount;

        $.post('{% url "funds:api_settings_update" %}', postData, function(response) {
            if (response.success) {
                alert(response.message + '\n\n注意: 修改后需要刷新页面生效。');
                settingsModal.hide();
            } else {
                alert('保存失败: ' + response.error);
            }
        }).fail(function() {
            alert('保存失败，请稍后重试');
        });
    });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
